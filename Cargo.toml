[workspace]
resolver = "2"
members = [
    "crates/tiles-gltf",
    "crates/tiles-core",
    "crates/tiles-model",
    "crates/tiles-read",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenAEC-Foundation/3d-tiles-dll"
publish = false

[workspace.dependencies]
serde_json = "1"
# Draco geometry (KHR_draco_mesh_compression), pure Rust, Apache-2.0
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "point_cloud_decode", "legacy_bitstream_decode"] }
# meshopt buffers (EXT_ and KHR_meshopt_compression), pure Rust port, MIT
meshopt-pure = { version = "1.3.0", default-features = false }
# Basis Universal textures in KTX2 (KHR_texture_basisu), pure Rust, Apache-2.0
basisu = "0.1.0"
# zip archives holding a tileset, MIT
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tiles-gltf = { path = "crates/tiles-gltf" }
tiles-core = { path = "crates/tiles-core" }
tiles-model = { path = "crates/tiles-model" }
tiles-read = { path = "crates/tiles-read" }

[profile.dev.package."*"]
opt-level = 2
